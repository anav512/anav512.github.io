<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #3B6DD4;
      --accent-light: #1a2a4a;
      --accent-dark: #a8c0f0;
      --bg: #0d0d0d;
      --bg-card: #161616;
      --text-primary: #f0ede8;
      --text-secondary: #a09e98;
      --text-tertiary: #6a6860;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ── Nav (Contact Bar) ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 0.5px solid var(--border);
      padding: 1rem 0;
    }

    nav .inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 13px;
      transition: color 0.2s;
    }

    .contact-link:hover {
      color: var(--accent);
    }

    .contact-icon-nav {
      font-size: 16px;
      color: var(--text-tertiary);
    }

    /* ── Hero ── */
    .hero {
      padding: 4rem 0 3rem;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .hero-tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.6px;
      background: var(--accent-light);
      color: var(--accent-dark);
      padding: 4px 12px;
      border-radius: 4px;
    }

    .hero-date {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .hero h1 {
      font-family: 'DM Mono', monospace;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }

    .hero-role {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 0;
    }

    /* ── Sections ── */
    section {
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    section:nth-child(1) { animation-delay: 0.1s; }
    section:nth-child(2) { animation-delay: 0.2s; }
    section:nth-child(3) { animation-delay: 0.3s; }

    .section-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 1.25rem;
    }

    /* ── Description ── */
    .description-block {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.85;
    }

    .description-block p + p {
      margin-top: 0.85rem;
    }

    /* ── Media Grid ── */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .media-item {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .media-item:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    /* Image slot — replace src with your image path */
    .media-item img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      display: block;
      background: var(--bg-card);
    }

    /* Video slot — replace src with your video path/URL */
    .media-item video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* YouTube / iframe embed slot */
    .media-item .embed-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
    }

    .media-item .embed-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .media-caption {
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 0.6rem 0.9rem 0.75rem;
      line-height: 1.5;
    }

    /* Full-width single media */
    .media-item.full {
      grid-column: 1 / -1;
    }

    /* ── PDF Report ── */
    .pdf-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.2s, transform 0.2s;
      text-decoration: none;
    }

    .pdf-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .pdf-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .pdf-icon {
      font-size: 22px;
      flex-shrink: 0;
      color: var(--accent);
    }

    .pdf-title {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-subtitle {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .pdf-arrow {
      font-size: 14px;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* No-report notice */
    .no-report {
      font-size: 12px;
      color: var(--text-tertiary);
      font-style: italic;
    }

    /* ── Footer ── */
    footer {
      border-top: 0.5px solid var(--border);
      padding: 1.5rem 0 2.5rem;
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* ── Animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      .container { padding: 0 1.25rem; }
      nav .inner { padding: 0 1.25rem; }
      .hero { padding: 2.5rem 0 2rem; }
      .media-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
